"alt compact" data-stage-open="${esc(x.cohort)}|${esc(x.subjectCode)}">Abrir estágio</button>`:`<button class="alt compact" data-open="${esc(x.cohort)}|${esc(x.subjectCode)}">${r?'Abrir disciplina':'Iniciar planejamento'}</button>`}${r&&canEdit()?`<button class="trash compact" data-del="${esc(r.id)}" title="Excluir disciplina">🗑️</button>`:''}</div>`}).join('')||'<p class="small">Nenhuma disciplina para os filtros selecionados.</p>'}<h3>Conflitos identificados (${conflictsAll.length})</h3>${conflictsAll.length?`<div class="error">${conflictsAll.slice(0,30).map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:'<div class="success">Nenhum conflito identificado nos registros atuais.</div>'}<div class="note"><b>Tempos dentro de sala:</b> ${P.reduce((s,p)=>s+regular(p[0]),0)}<br><b>Tempos extraclasse:</b> ${P.reduce((s,p)=>s+extra(p[0]),0)}<br><b>Tempos de estágio:</b> ${P.reduce((s,p)=>s+stageLoad(p[0]),0)}</div><button id="submit" ${!canEdit()||!expected.length||counts.Parcial||counts.Pendente||conflictsAll.length?'disabled':''}>Enviar para conferência</button>${canEdit()&&(counts.Parcial||counts.Pendente||conflictsAll.length)?'<p class="small">O envio exige todas as disciplinas completas e sem conflitos.</p>':''}`}
if(screen==='summary')h+=`<h2>Resumo dos professores</h2>${P.map(t=>{let pp=db.records.flatMap(r=>r.parts.filter(p=>p.teacher===t[0]).map(p=>({...p,subject:r.subjectName,cohort:r.cohort})));let ex=db.extras.filter(e=>e.teacher===t[0]);if(!pp.length&&!ex.length&&!stageAssignments(t[0]).length)return '';return `<div class="item"><b>${esc(t[1])}</b> — ${esc(t[2])}<div class="small">${regular(t[0])} tempos dentro de sala | ${extra(t[0])} tempos extraclasse | Estágio: ${stageLoad(t[0])} tempos</div>${pp.map(p=>`<p>${esc(p.subject)} — ${esc(p.label)} — ${esc(p.cohort)} — ${esc(p.day)}, ${display(p.blocks)} — ${esc(p.room)} (${p.n} tempos)</p>`).join('')}${ex.map(e=>`<p>Extraclasse: ${esc(e.type)} (${e.n} tempos)</p>`).join('')}${stageAssignments(t[0]).map(({g,p,n})=>`<p>Estágio: ${esc(g.label)} · ${esc(g.location)} · ${n} tempos</p>`).join('')}</div>`}).join('')||'<p>Nenhum docente com atribuições.</p>'}`;
if(screen==='extra')h+=`<h2>Atividade extraclasse</h2><p>Docente: <b>${esc(name(professor))}</b></p>${field('Atividade','type',['NDE','Coordenação','Atendimento ao aluno','Orientação acadêmica','Outras atividades'],x=>x,x=>x,'NDE')}<label>Tempos semanais</label><input id="nextra" type="number" min="1" step="1" value="2"><button id="saveextra">Salvar atividade</button><button class="alt" data-go="home">Voltar</button>`;
if(screen==='admin')h+=`<h2>Planejamento Acadêmico — simulação</h2><div class="banner"><b>Ambiente demonstrativo:</b> sem login ou permissões reais. Nesta versão, o acesso administrativo é apenas para testar as regras.</div><h3>Turmas ofertadas no semestre</h3><p class="small">Selecione as turmas que integrarão o planejamento. Todas as opções de período e turno estão abertas para o piloto 2027.1; não há bloqueio por oferta neste momento.</p><div class="row">${allCohorts.map(c=>`<label class="check" style="margin:4px 0;font-weight:400"><input type="checkbox" data-active="${c.code}" ${db.active.includes(c.code)?'checked':''} ${!canEdit()?'disabled':''}>${c.code} — ${shifts[c.shift]}</label>`).join('')}</div><h3>Conferência administrativa</h3><div class="note">Situação: <b>${db.workflow==='editing'?'Em elaboração':db.workflow==='submitted'?'Enviado para conferência':'Aprovado'}</b></div>${db.comments?`<div class="note"><b>Última orientação:</b> ${esc(db.comments)}</div>`:''}${db.workflow==='submitted'?`<label for="comments">Orientações para correção (opcional)</label><textarea id="comments" style="width:100%;box-sizing:border-box;min-height:90px;padding:10px">${esc(db.comments)}</textarea><div class="actions"><button id="reopen" class="alt">Reabrir para correção</button><button id="approve">Aprovar planejamento</button></div>`:db.workflow==='approved'?`<button id="reopen">Reabrir planejamento</button>`:'<p class="small">O coordenador ainda pode editar. O envio será disponibilizado na Conferência quando não houver pendências.</p>'}<h3>Observações por disciplina</h3><p class="small">Registre observações vinculadas à disciplina; o status é atualizado pela equipe de Planejamento Acadêmico.</p>${field('Disciplina para observação','obsSubject',[...allExpected().map(x=>({id:'D|'+x.cohort+'|'+x.subjectCode,label:'Docência · '+x.cohort+' · '+x.subjectName})),...stageExpected().map(x=>({id:'E|'+x.cohort+'|'+x.subjectCode,label:'Estágio · '+x.cohort+' · '+x.subjectName}))],x=>x.id,x=>x.label,'')}<label>Observação</label><textarea id="obsText" style="width:100%;box-sizing:border-box;min-height:70px;padding:10px"></textarea><button id="addObservation" class="alt">Registrar observação</button>${db.observations.map(o=>`<div class="item"><b>${esc(o.subject)}</b> ${statusTag(o.status)}<div>${esc(o.text)}</div><div class="small">${esc(o.when)}</div><div class="actions"><button class="alt compact" data-obs-status="${esc(o.id)}|Corrigida">Corrigida</button><button class="alt compact" data-obs-status="${esc(o.id)}|Validada">Validada</button><button class="alt compact" data-obs-status="${esc(o.id)}|Pendente">Pendente</button></div></div>`).join('')}<h3>Histórico de ações</h3>${db.events.slice().reverse().map(e=>`<div class="item small">${esc(e.when)} — ${esc(e.action)}</div>`).join('')||'<p class="small">Nenhum evento registrado.</p>'}`;
$('app').innerHTML=h;wire();stageWire();}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));let bind=(id,fn)=>{if($(id))$(id).onclick=fn},change=(id,fn)=>{if($(id))$(id).onchange=e=>fn(e.target.value)};
change('prof',v=>{professor=v;render()});bind('salaryprint',()=>window.print());bind('exportexcel',exportExcel);bind('new',()=>startNew());bind('extra',()=>go('extra'));
change('cohort',v=>{let c=cohort(v);draft.cohort=v;draft.period=c.period;draft.shift=c.shift;draft.subjectCode=M.find(m=>m[2]===c.period&&!m[8])[0];draft.subjectName=subject(draft.subjectCode,draft.period)[1];draft.parts=[];render()});
change('subject',v=>{draft.subjectCode=v;draft.subjectName=subject(v,draft.period)[1];draft.parts=[];render()});change('groups',v=>{draft.groups=Number(v);draft.parts=[];render()});change('manualN',v=>{draft.manualN=Math.max(1,Math.min(6,Number(v)||1));draft.parts=[];render()});
bind('next',()=>{step=0;go('lesson')});bind('draftsave',saveDraft);
change('differentTeacher',()=>{});if($('differentTeacher'))$('differentTeacher').onchange=e=>{let p=partValue(step);p.teacher=e.target.checked?P.find(x=>x[0]!==draft.teacher)?.[0]:draft.teacher;updatePart(step,'teacher',p.teacher)};
change('partprof',v=>updatePart(step,'teacher',v));for(let k of ['day','start','room'])change(k,v=>updatePart(step,k,v));
bind('partsave',()=>{let p=toPart(step);draft.parts=draft.parts.filter(x=>x.key!==p.key);draft.parts.push(toStored(p,step));render()});bind('prev',()=>{if(step===0)go('data');else{step--;render()}});bind('forward',()=>{let p=toPart(step);draft.parts=draft.parts.filter(x=>x.key!==p.key);draft.parts.push(toStored(p,step));if(step<chooseParts().length-1){step++;render()}else completeDraft()});
change('fperiod',v=>{filterPeriod=v;render()});change('fshift',v=>{filterShift=v;render()});change('fstatus',v=>{filterStatus=v;render()});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let [c,s]=b.dataset.open.split('|'),r=db.records.find(r=>r.cohort===c&&r.subjectCode===s);if(r)editRecord(r.id);else if(canEdit())startNew(c,s)});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRecord(b.dataset.edit));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!canEdit())return;if(confirm('Excluir toda a disciplina, incluindo etapas atribuídas a outros professores?')){db.records=db.records.filter(r=>r.id!==b.dataset.del);persist();render()}});
document.querySelectorAll('[data-delextra]').forEach(b=>b.onclick=()=>{if(!canEdit())return;if(confirm('Excluir esta atividade extraclasse?')){db.extras=db.extras.filter(e=>e.id!==b.dataset.delextra);persist();render()}});
bind('saveextra',()=>{let n=Number($('nextra').value);if(!Number.isInteger(n)||n<1){alert('Informe tempos inteiros positivos.');return}db.extras.push({id:uid(),teacher:professor,type:$('type').value,n});persist();go('home')});
document.querySelectorAll('[data-active]').forEach(b=>b.onchange=e=>{if(!canEdit())return;let code=b.dataset.active;if(!e.target.checked&&db.records.some(r=>r.cohort===code)){alert('Esta turma possui disciplinas cadastradas. Exclua os registros antes de desativá-la.');render();return}if(!e.target.checked&&db.stages.some(g=>g.cohort===code)){alert('Esta turma possui grupos de estágio cadastrados. Exclua-os antes de desmarcar a turma.');render();return}db.active=e.target.checked?[...db.active,code]:db.active.filter(x=>x!==code);persist();render()});
bind('submit',()=>{if(!confirm('Enviar o planejamento para conferência? Após o envio, a edição ficará bloqueada.'))return;let exp=allExpected();if(!exp.length||exp.some(x=>!x.record||getStatus(x.record)!=='Completa')||stageExpected().some(x=>stageStatus(x)!=='Completa')||allConflicts().length){alert('Existem pendências ou conflitos.');return}db.workflow='submitted';db.events.push({when:new Date().toLocaleString('pt-BR'),action:'Enviado para conferência'});persist();render()});
bind('reopen',()=>{if(db.workflow==='approved'&&!prompt('Motivo obrigatório para reabrir um planejamento aprovado:')?.trim()){alert('Informe o motivo da reabertura.');return}if(!confirm('Reabrir o planejamento para o coordenador corrigir?'))return;db.comments=$('comments')?.value||db.comments;db.workflow='editing';db.events.push({when:new Date().toLocaleString('pt-BR'),action:'Reaberto para correção'});persist();render()});
bind('addObservation',()=>{let key=$('obsSubject')?.value,txt=$('obsText')?.value?.trim();if(!key||!txt){alert('Selecione uma disciplina e escreva a observação.');return}let opt=$('obsSubject').selectedOptions[0];db.observations.push({id:uid(),subject:opt.textContent,text:txt,status:'Pendente',when:new Date().toLocaleString('pt-BR')});persist();render()});document.querySelectorAll('[data-obs-status]').forEach(b=>b.onclick=()=>{let [id,status]=b.dataset.obsStatus.split('|');let o=db.observations.find(o=>o.id===id);if(o){o.status=status;persist();render()}});bind('approve',()=>{if(db.observations.some(o=>o.status!=='Validada')){alert('Valide todas as observações antes de aprovar.');return}if(!confirm('Aprovar o planejamento?'))return;db.versions.push({when:new Date().toISOString(),records:JSON.parse(JSON.stringify(db.records)),stages:JSON.parse(JSON.stringify(db.stages)),extras:JSON.parse(JSON.stringify(db.extras))});db.workflow='approved';db.events.push({when:new Date().toLocaleString('pt-BR'),action:'Planejamento aprovado'});persist();render()});
