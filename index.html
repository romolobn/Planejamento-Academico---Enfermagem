<style>body{font:15px system-ui;background:#f2f5fa;color:#1d3048;margin:0}header{background:#193e63;color:white;padding:22px}main{max-width:1040px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:22px;margin-bottom:14px}h1{margin:0;font-size:24px}h2{margin-top:0}label{display:block;font-weight:600;margin:14px 0 5px}select,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c8d5e2;border-radius:8px;background:white;font:inherit}button{background:#2269a4;color:white;border:0;border-radius:8px;padding:11px 15px;cursor:pointer;margin:5px 5px 5px 0;font:inherit}button:disabled{opacity:.4}button.alt{background:#e8eff6;color:#204c70}.note{background:#eff5fc;padding:13px;border-radius:9px;margin:15px 0}.error{background:#ffeded;color:#9b2525;padding:12px;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:13px;color:#61748a}.item{border:1px solid #dde6ef;padding:12px;border-radius:9px;margin:9px 0}@media(max-width:550px){.row{grid-template-columns:1fr!important}}button.trash{background:#fff0f0;color:#a52631;border:1px solid #f2c9cb;font-size:18px;padding:7px 10px;flex-shrink:0}button.trash:hover{background:#ffe0e0}.professor-destaque{background:#e7f1fc;border:1px solid #bad5f1;border-left:5px solid #2269a4;border-radius:10px;padding:14px 16px;margin:14px 0 19px}.professor-destaque span{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#3e6489;margin-bottom:4px}.professor-destaque strong{display:block;font-size:19px;color:#153c62} .toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{display:inline-block;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700;background:#eaf0f8}.tag.ok{background:#e2f5e9;color:#14643a}.tag.warn{background:#fff0d8;color:#8b5200}.tag.bad{background:#ffebeb;color:#9b2525}.muted{color:#60758a}.stat{padding:13px;background:#f3f7fc;border-radius:10px}.stat strong{display:block;font-size:23px}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.compact{padding:7px 10px;font-size:13px}.banner{background:#fff6df;border:1px solid #e8d29b;border-radius:9px;padding:12px;margin:10px 0}.success{background:#e6f6ec;border-radius:9px;padding:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:550px){.grid3{grid-template-columns:1fr}} 
.salary-head{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #193e63;padding-bottom:14px;margin-bottom:16px}
.salary-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.salary-meta>div{background:#f2f6fa;border-radius:8px;padding:12px}
.salary-meta small{display:block;color:#61748a}
.salary-section{margin:20px 0}.salary-section h3{background:#e9f1f9;padding:10px;border-left:4px solid #2269a4}
.salary-table{border-collapse:collapse;width:100%;font-size:12px}
.salary-table td,.salary-table th{border:1px solid #cbd7e4;padding:8px;text-align:left}
.salary-table th,.salary-table tfoot td{background:#edf3f9;font-weight:bold}
.salary-table .num{text-align:center}
.salary-category{background:#193e63;color:white;padding:12px;margin:22px 0 4px;border-radius:7px}.salary-person{padding:18px 0;border-bottom:2px solid #b7c9d9}.salary-person:last-of-type{border-bottom:0}.salary-foot{border-top:1px solid #dce5ee;padding-top:12px;margin-top:18px;font-size:12px;color:#61748a}
@media print{header,.toolbar,main>.small,.no-print{display:none!important}body{background:white}main{max-width:none;margin:0;padding:0}.card{border:0;padding:0}.salary-table thead{display:table-header-group}.salary-person{break-before:page;page-break-before:always}.salary-person:first-of-type{break-before:auto;page-break-before:auto}@page{size:A4 landscape;margin:12mm}}

/* Cabeçalho nativo, nítido e responsivo — sem imagem de texto. */

header .header-title{flex:1 1 480px;min-width:0}
header .header-title h1{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:clamp(28px,2.9vw,48px);line-height:1.12;font-weight:750;letter-spacing:-.035em;margin:0 0 8px;color:#fff;text-rendering:optimizeLegibility}

header .brand-logos .logo-cell+.logo-cell{border-left:1px solid #ccd2d9}

@media(max-width:1080px){header .header-content{flex-wrap:wrap;gap:18px}header .header-title{flex:1 1 100%}header .brand-logos{flex:0 1 100%;max-width:800px;min-width:0}}
@media(max-width:550px){header{padding:20px 14px}header .header-title h1{font-size:28px}header .header-subtitle{font-size:13px}header .brand-logos{padding:10px 6px;border-radius:10px}header .brand-logos .logo-cell{height:57px;padding:0 6px}header .brand-logos img{max-height:51px}}
@media print{header{display:none!important}}

// Validação estrutural, sem correção acadêmica nem exclusão de registros.
function storageShapeErrors(data){
 const object=x=>!!x&&typeof x==='object'&&!Array.isArray(x),errors=[];
 if(!object(data))return ['O conteúdo não é um objeto de planejamento.'];
 const pending=[data];
 while(pending.length){const value=pending.pop();if(typeof value==='number'&&!Number.isFinite(value)){errors.push('Número fora do intervalo suportado; o conteúdo original requer revisão.');break}if(value&&typeof value==='object')for(const child of Object.values(value))pending.push(child)}
 if(!Array.isArray(data.records))errors.push('records deve ser uma lista.');
 for(const field of ['extras','stages','active','events','observations','versions'])if(field in data&&!Array.isArray(data[field]))errors.push(field+' deve ser uma lista.');
 if('workflow' in data&&!['editing','submitted','approved'].includes(data.workflow))errors.push('Situação do planejamento não reconhecida.');
 if('comments' in data&&typeof data.comments!=='string')errors.push('Comentários com estrutura não reconhecida.');
 if(Array.isArray(data.active)&&data.active.some(x=>typeof x!=='string'))errors.push('Turmas ofertadas com estrutura não reconhecida.');
 const objects=(list,path)=>{if(!Array.isArray(list))return [];if(list.some(x=>!object(x))){errors.push(path+' contém item sem estrutura de objeto.');return list.filter(object)}return list};
 for(const r of objects(data.records,'records')){
  if(!Array.isArray(r.parts)){errors.push('Um registro de Docência não possui lista de atribuições.');continue}
  for(const part of objects(r.parts,'parts'))if(part.blocks!=null&&(!Array.isArray(part.blocks)||part.blocks.some(x=>!Array.isArray(x)||x.length!==2||x.some(n=>typeof n!=='number'))))errors.push('Horário de Docência com estrutura não reconhecida.');
 }
 objects(data.extras,'extras');objects(data.events,'events');objects(data.observations,'observations');objects(data.versions,'versions');
 for(const g of objects(data.stages,'stages')){
  if(!Array.isArray(g.people)){errors.push('Um grupo de Campo não possui lista de profissionais.');continue}
  for(const person of objects(g.people,'people')){
   if(!Array.isArray(person.schedule)){errors.push('Um profissional de Campo não possui lista de horários.');continue}
   objects(person.schedule,'schedule');
  }
 }
 return errors;
}
function readStoredSource(storageKey){
 let raw;
 try{raw=localStorage.getItem(storageKey)}catch(e){return {key:storageKey,raw:null,status:'unreadable',errors:['Não foi possível acessar esta chave.']}}
 if(raw===null)return {key:storageKey,raw,status:'absent',errors:[]};
 let data;
 try{data=JSON.parse(raw)}catch(e){return {key:storageKey,raw,status:'invalid',errors:['JSON inválido.']}}
 let errors;
 try{errors=storageShapeErrors(data)}catch(e){errors=['A estrutura não pôde ser validada com segurança.']}
 return {key:storageKey,raw,status:errors.length?'invalid':'valid',errors,data};
}

 }

  const label='Atribuição '+(i+1),expected=req.find(x=>x.key===p.key);

function stageErrors(g){
 const errors=[],label=(g?.label||'Grupo sem identificação')+' [registro '+(g?.id||'sem identificação')+' · '+(g?.cohort||'turma ausente')+' · disciplina '+(g?.subjectCode||'ausente')+']';
 const fail=message=>errors.push(label+': '+message);
 if(!g||typeof g!=='object'){fail('Registro de Campo inválido.');return errors}
 const c=cohort(g.cohort),m=c&&subject(g.subjectCode,c.period);
 if(!c||!m?.[8])fail('Turma e disciplina de Estágio incompatíveis ou inexistentes.');
 if(!stageLocations.includes(g.location))fail('Local de estágio não cadastrado.');
 if(!Number.isInteger(Number(g.students))||Number(g.students)<1)fail('Informe a quantidade de alunos (número inteiro positivo).');
 if(!Array.isArray(g.people)||!g.people.length){fail('Adicione pelo menos um profissional responsável.');return errors}
 const ids=new Set();
 g.people.forEach((p,i)=>{
  const person='Profissional '+(i+1);
  if(!p||typeof p!=='object'){fail(person+': atribuição inválida.');return}
  if(!P.some(x=>x[0]===p.id)&&!LEGACY_P.some(x=>x[0]===p.id))fail(person+': profissional não cadastrado.');
  if(ids.has(p.id))fail(person+': profissional repetido no mesmo grupo; utilize vários dias na escala.');
  ids.add(p.id);
  if(!validAssigned(p.weeklyAssigned))fail(person+': informe carga semanal individual inteira, maior ou igual a zero.');
  if(!Array.isArray(p.schedule)||!p.schedule.length){fail(person+': cadastre pelo menos um horário.');return}
  p.schedule.forEach((x,j)=>{
   const slot=person+', horário '+(j+1);
   if(!x||typeof x!=='object'){fail(slot+': escala inválida.');return}
   if(!days.includes(x.day))fail(slot+': dia não cadastrado.');
   const validTime=value=>typeof value==='string'&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
   const startOK=validTime(x.start),endOK=validTime(x.end);
   if(!startOK)fail(slot+': preencha o horário de início válido (HH:MM, 00:00 a 23:59).');
   if(!endOK)fail(slot+': preencha o horário de término válido (HH:MM, 00:00 a 23:59).');
   if(startOK&&endOK&&minutes(x.start)>=minutes(x.end))fail(slot+': o término deve ser posterior ao início.');
  });
 });
 return errors;
}

function excelRows(salaryOnly=false){

 db.stages.forEach(g=>g.people.filter(p=>include(p.id)).forEach(p=>{let m=stageSubjects().find(m=>m[0]===g.subjectCode);rows.push(['ESTÁGIO',SEMESTER,g.cohort,g.subjectCode,m?.[1]||'',g.label,g.location,professionalLabel(p.id),mat(p.id),classification(p.id),g.students,p.schedule.map(x=>x.day+' '+x.start+'–'+x.end).join(' / '),0,m?.[4]||0,0,weeklyReportValue(assignedWeekly(p.weeklyAssigned)),...(extensionColumns?['',0]:[])])}));

 const title=salaryOnly?'Grade Salarial 2027.1':'Planejamento 2027.1';

}

if(screen==='summary')h+=`<h2>Resumo dos professores</h2>${pendingLoadsNote()?`<div class="banner">${esc(pendingLoadsNote())}</div>`:''}${P.map(t=>{let pp=db.records.flatMap(r=>r.parts.filter(p=>p.teacher===t[0]).map(p=>({...p,subject:r.subjectName,cohort:r.cohort,stage:stageCurricular(r.subjectCode)})));let ex=db.extras.filter(e=>e.teacher===t[0]);if(!pp.length&&!ex.length&&!stageAssignments(t[0]).length)return '';return `<div class="item"><b>${esc(professionalLabel(t[0]))}</b> — ${esc(t[2])}<div class="small">${regular(t[0])} tempos dentro de sala | ${extra(t[0])} tempos extraclasse | Estágio: ${stageLoad(t[0])} tempos</div>${pp.map(p=>`<p>${esc(p.subject)} — ${esc(p.label)} — ${esc(p.cohort)} — ${esc(p.day)}, ${display(p.blocks)} — ${esc(p.room)} (${docenciaAssignmentLabel(p)})</p>`).join('')}${ex.map(e=>`<p>Extraclasse: ${esc(e.type)} (${e.n} tempos)</p>`).join('')}${stageAssignments(t[0]).map(({g,p,n})=>`<p>Estágio: ${esc(g.label)} · ${esc(g.location)} · ${fieldAssignmentLabel(p)}</p>`).join('')}</div>`}).join('')||'<p>Nenhum docente com atribuições.</p>'}`;
if(screen==='extra')h+=`<h2>Atividade extraclasse</h2><p>Docente: <b>${esc(name(professor))}</b></p>${field('Atividade','type',['NDE','Coordenação','Atendimento ao aluno','Orientação acadêmica','Outras atividades'],x=>x,x=>x,'NDE')}<label>Tempos semanais</label><input id="nextra" type="number" min="1" step="1" value="2"><button id="saveextra">Salvar atividade</button><button class="alt" data-go="home">Voltar</button>`;
if(screen==='admin')h+=`<h2>Planejamento Acadêmico — simulação</h2><div class="banner"><b>Ambiente demonstrativo:</b> sem login ou permissões reais. Nesta versão, o acesso administrativo é apenas para testar as regras.</div><h3>Turmas ofertadas no semestre</h3><p class="small">Marque as turmas que realmente abrirão em 2027.1, por período e turno. Apenas as turmas marcadas aparecerão em Docência, Estágio e Conferência. Esta é uma configuração demonstrativa, sem definição de permissões de usuário.</p><div class="row">${allCohorts.map(c=>`<label class="check" style="margin:4px 0;font-weight:400"><input type="checkbox" data-active="${c.code}" ${db.active.includes(c.code)?'checked':''} ${!canEdit()?'disabled':''}>${c.code} — ${shifts[c.shift]}</label>`).join('')}</div><div class="note"><b>${db.active.length} turma(s) ofertada(s) em 2027.1.</b> As demais não gerarão pendências.</div><h3>Conferência administrativa</h3><div class="note">Situação: <b>${db.workflow==='editing'?'Em elaboração':db.workflow==='submitted'?'Enviado para conferência':'Aprovado'}</b></div>${db.comments?`<div class="note"><b>Última orientação:</b> ${esc(db.comments)}</div>`:''}${db.workflow==='submitted'?`<label for="comments">Orientações para correção (opcional)</label><textarea id="comments" style="width:100%;box-sizing:border-box;min-height:90px;padding:10px">${esc(db.comments)}</textarea><div class="actions"><button id="reopen" class="alt">Reabrir para correção</button><button id="approve">Aprovar planejamento</button></div>`:db.workflow==='approved'?`<button id="reopen">Reabrir planejamento</button>`:'<p class="small">O coordenador ainda pode editar. O envio será disponibilizado na Conferência quando não houver pendências.</p>'}<h3>Observações por disciplina</h3><p class="small">Registre observações vinculadas à disciplina; o status é atualizado pela equipe de Planejamento Acadêmico.</p>${canManageObservations()?`${field('Disciplina para observação','obsSubject',observationOptions(),x=>x.id,x=>x.label,'')}<label>Observação</label><textarea id="obsText" style="width:100%;box-sizing:border-box;min-height:70px;padding:10px"></textarea><button id="addObservation" class="alt">Registrar observação</button>`:'<div class="note">Observações acadêmicas bloqueadas após a aprovação. Reabra formalmente o planejamento, informando o motivo, para alterá-las.</div>'}${db.observations.map(o=>`<div class="item"><b>${esc(o.subject)}</b> ${statusTag(o.status)}<div>${esc(o.text)}</div><div class="small">${esc(observationTargetLabel(o))}</div>${canManageObservations()&&!observationHasTarget(o)?`${field('Vincular observação anterior','obslink-'+o.id,[{id:'',label:'Selecione o vínculo correto'},...observationOptions()],x=>x.id,x=>x.label,'')}<button class="alt compact" data-obs-link="${esc(o.id)}">Confirmar vínculo da observação</button>`:''}<div class="small">${esc(o.when)}</div>${canManageObservations()?`<div class="actions"><button class="alt compact" data-obs-status="${esc(o.id)}|Corrigida">Corrigida</button><button class="alt compact" data-obs-status="${esc(o.id)}|Validada">Validada</button><button class="alt compact" data-obs-status="${esc(o.id)}|Pendente">Pendente</button></div>`:''}</div>`).join('')}<h3>Histórico de ações</h3>${db.events.slice().reverse().map(e=>`<div class="item small">${esc(e.when)} — ${esc(e.action)}${e.reason?`<div><b>Motivo administrativo da reabertura:</b> <span style="white-space:pre-wrap">${esc(e.reason)}</span></div>`:''}</div>`).join('')||'<p class="small">Nenhum evento registrado.</p>'}`;
$('app').innerHTML=h;wire();stageWire();}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));let bind=(id,fn)=>{if($(id))$(id).onclick=fn},change=(id,fn)=>{if($(id))$(id).onchange=e=>fn(e.target.value)};
change('prof',v=>{professor=v;render()});bind('salaryprint',()=>window.print());bind('exportexcel',()=>exportExcel());bind('salaryexportexcel',()=>exportExcel(true));bind('new',()=>startNew());bind('extra',()=>go('extra'));
change('cohort',v=>{let c=cohort(v);draft.cohort=v;draft.period=c.period;draft.shift=c.shift;draft.subjectCode=M.find(m=>m[2]===c.period&&!m[8])[0];draft.subjectName=subject(draft.subjectCode,draft.period)[1];draft.parts=[];render()});
change('subject',v=>{draft.subjectCode=v;draft.subjectName=subject(v,draft.period)[1];draft.parts=[];render()});change('groups',v=>{draft.groups=Number(v);draft.parts=[];render()});change('manualN',v=>{draft.manualN=Math.max(1,Math.min(6,Number(v)||1));draft.parts=stageCurricular(draft.subjectCode)?draft.parts.map(p=>({...p,n:draft.manualN,blocks:calc(p.start,draft.manualN,draft.shift)})):[];render()});
bind('docaddteacher',addDocTeacher);bind('docremoveteacher',removeDocTeacher);change('docprof',v=>updatePart(step,'teacher',v));bind('next',()=>{step=0;go('lesson')});bind('draftsave',saveDraft);
change('differentTeacher',()=>{});if($('differentTeacher'))$('differentTeacher').onchange=e=>{let p=partValue(step);p.teacher=e.target.checked?P.find(x=>x[0]!==draft.teacher)?.[0]:draft.teacher;updatePart(step,'teacher',p.teacher)};
change('docweekly',v=>{if(!validAssigned(v)){updatePart(step,'weeklyAssigned',v);alert('Informe um número inteiro igual ou maior que zero.');return;}updatePart(step,'weeklyAssigned',Number(v))});change('partprof',v=>updatePart(step,'teacher',v));for(let k of ['day','start','room'])change(k,v=>updatePart(step,k,v));
bind('partsave',()=>{let p=toPart(step);let index=draft.parts.findIndex(x=>x.key===p.key);if(index<0)draft.parts.push(toStored(p,step));else draft.parts[index]=toStored(p,step);render()});bind('prev',()=>{if(stageCurricular(draft.subjectCode)){let p=toStored(toPart(step),step);let index=draft.parts.findIndex(x=>x.key===p.key);if(index<0)draft.parts.push(p);else draft.parts[index]=p}if(step===0)go('data');else{step--;render()}});bind('forward',()=>{let p=toPart(step);let index=draft.parts.findIndex(x=>x.key===p.key);if(index<0)draft.parts.push(toStored(p,step));else draft.parts[index]=toStored(p,step);if(step<chooseParts().length-1){step++;render()}else completeDraft()});
change('fperiod',v=>{filterPeriod=v;render()});change('fshift',v=>{filterShift=v;render()});change('fstatus',v=>{filterStatus=v;render()});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let [c,s]=b.dataset.open.split('|'),r=db.records.find(r=>r.cohort===c&&r.subjectCode===s);if(r)editRecord(r.id);else if(canEdit())startNew(c,s)});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRecord(b.dataset.edit));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!canEdit())return;if(confirm('Excluir toda a disciplina, incluindo etapas atribuídas a outros professores?')){db.records=db.records.filter(r=>r.id!==b.dataset.del);persist();render()}});
document.querySelectorAll('[data-delextra]').forEach(b=>b.onclick=()=>{if(!canEdit())return;if(confirm('Excluir esta atividade extraclasse?')){db.extras=db.extras.filter(e=>e.id!==b.dataset.delextra);persist();render()}});
bind('saveextra',()=>{if(!canEdit())return;let n=Number($('nextra').value);if(!Number.isInteger(n)||n<1){alert('Informe tempos inteiros positivos.');return}db.extras.push({id:uid(),teacher:professor,type:$('type').value,n});persist();go('home')});
document.querySelectorAll('[data-active]').forEach(b=>b.onchange=e=>{if(!canEdit())return;let code=b.dataset.active;if(!e.target.checked&&db.records.some(r=>r.cohort===code)){alert('Esta turma possui disciplinas cadastradas. Exclua os registros antes de desativá-la.');render();return}if(!e.target.checked&&db.stages.some(g=>g.cohort===code)){alert('Esta turma possui grupos de estágio cadastrados. Exclua-os antes de desmarcar a turma.');render();return}db.active=e.target.checked?[...db.active,code]:db.active.filter(x=>x!==code);persist();render()});
document.querySelectorAll('[data-conference-field]').forEach(b=>b.onclick=()=>{[stageCohort,stageSubject]=b.dataset.conferenceField.split('|');stageTab='groups';go('stage')});
bind('submit',()=>{if(!canEdit())return;const validation=planningValidation();if(!validation.valid){alert('Existem pendências, conflitos ou duplicidades nas turmas ofertadas.');return}if(!confirm('Enviar o planejamento para conferência? Após o envio, a edição ficará bloqueada.'))return;db.workflow='submitted';db.events.push({when:new Date().toLocaleString('pt-BR'),action:'Enviado para conferência'});persist();render()});
bind('reopen',()=>{
 if(!['approved','submitted'].includes(db.workflow))return;
 const approved=db.workflow==='approved';
 const reason=approved?prompt('Motivo obrigatório para reabrir um planejamento aprovado:')?.trim():null;
 if(approved&&!reason){alert('Informe o motivo da reabertura.');return}
 if(!confirm('Reabrir o planejamento para o coordenador corrigir?'))return;
 // O motivo administrativo pertence ao evento, não às observações acadêmicas.
 if(!approved)db.comments=$('comments')?.value||db.comments;
 const now=new Date(),event={when:now.toLocaleString('pt-BR'),at:now.toISOString(),action:'Reaberto para correção'};
 if(approved)event.reason=reason;
 db.workflow='editing';db.events.push(event);persist();render();
});
bind('addObservation',()=>{if(!canManageObservations())return;const key=$('obsSubject')?.value,txt=$('obsText')?.value?.trim(),target=observationOptions().find(x=>x.id===key);if(!target||!txt){alert('Selecione uma disciplina e escreva a observação.');return}const o={id:uid(),subject:target.label,text:txt,status:'Pendente',when:new Date().toLocaleString('pt-BR')};linkObservation(o,key);db.observations.push(o);persist();render()});
document.querySelectorAll('[data-obs-link]').forEach(b=>b.onclick=()=>{if(!canManageObservations())return;const o=db.observations.find(o=>o.id===b.dataset.obsLink);if(!o||!linkObservation(o,$('obslink-'+o.id)?.value)){alert('Selecione o núcleo, a turma e a disciplina corretos.');return}persist();render()});
document.querySelectorAll('[data-obs-status]').forEach(b=>b.onclick=()=>{if(!canManageObservations())return;let [id,status]=b.dataset.obsStatus.split('|');let o=db.observations.find(o=>o.id===id);if(o){o.status=status;persist();render()}});
bind('approve',()=>{if(db.workflow!=='submitted')return;if(!planningValidation().valid){alert('Planejamento incompleto, com conflitos ou duplicidades. Reabra para correção antes de aprovar.');return}if(db.observations.some(o=>o.status!=='Validada'||!observationHasTarget(o))){alert('Vincule as observações ao núcleo, turma e disciplina e valide todas antes de aprovar.');return}if(!confirm('Aprovar o planejamento?'))return;const approvedAt=new Date();db.workflow='approved';db.events.push({when:approvedAt.toLocaleString('pt-BR'),at:approvedAt.toISOString(),action:'Planejamento aprovado'});db.versions.push(approvalSnapshot(approvedAt.toISOString()));persist();render()});
}
render();

</script></html>
